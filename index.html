<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Produtividade - PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="app-header">
        <h1>Missões Ativas</h1>
        <span class="xp-badge">Nível 5 | 1200 XP</span>
    </header>

    <main id="quest-board" class="feed">
        </main>

    <nav class="bottom-nav">
        <button class="nav-item active">⚔️ Missões</button>
        <button class="nav-item">💰 Loja</button>
        <button class="nav-item">🛡️ Perfil</button>
        
        <button class="fab" id="add-btn" aria-label="Nova Missão">+</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
