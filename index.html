<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Produtividade - Micro-interação</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Modal / Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #1e1e1e;
      border: 1px solid #333333;
      padding: 32px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    #lottie-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px auto;
    }

    h2 {
      font-size: 1.4rem;
      color: #bb86fc; /* Roxo RPG */
      margin-bottom: 8px;
    }

    p {
      color: #aaaaaa;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .xp-gain {
      display: inline-block;
      background-color: rgba(255, 215, 0, 0.15);
      color: #ffd700; /* Dourado */
      border: 1px solid #ffd700;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    .btn-complete {
      background-color: #bb86fc;
      color: #000000;
      box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
    }

    .btn-collect {
      background-color: #10b981;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Botão simulando a conclusão de uma tarefa -->
  <button id="open-btn" class="btn btn-complete" style="width: auto;">Concluir Missão ⚔️</button>

  <!-- Modal de Recompensa -->
  <div id="overlay" class="modal-overlay">
    <div id="modal" class="modal-card">
      <div id="lottie-container"></div>
      <h2>Missão Concluída! 🏆</h2>
      <p>Você derrotou a tarefa e evoluiu seu herói.</p>
      <div class="xp-gain">+100 XP | +50 Moedas</div>
      <button id="close-btn" class="btn btn-collect">Coletar Recompensa</button>
    </div>
  </div>

  <!-- CDN Lottie Web -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  
  <!-- CDN Motion One -->
  <script src="https://cdn.jsdelivr.net/npm/@motionone/dom/dist/motion.prod.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('overlay');
      const modal = document.getElementById('modal');
      const openBtn = document.getElementById('open-btn');
      const closeBtn = document.getElementById('close-btn');

      // Animação Lottie de Checkmark (sucesso)
      const sampleLottieJSON = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        v: "5.5.7", fr: 60, ip: 0, op: 60, w: 100, h: 100, nm: "Check",
        layers: [{
          ddd: 0, ind: 1, ty: 4, nm: "Checkmark", sr: 1, ks: {
            o: { a: 0, k: 100 }, r: { a: 0, k: 0 }, p: { a: 0, k: [50, 50, 0] },
            a: { a: 0, k: [0, 0, 0] }, s: { a: 0, k: [100, 100, 100] }
          },
          shapes: [{
            ty: "grp", items: [
              {
                ty: "sh", ks: {
                  a: 0, k: {
                    i: [[0,0],[0,0],[0,0]], o: [[0,0],[0,0],[0,0]],
                    v: [[-20, 0], [-5, 15], [20, -10]], c: false
                  }
                }
              },
              { ty: "st", c: { a: 0, k: [0.73, 0.52, 0.98, 1] }, w: { a: 0, k: 7 }, lc: 2, lj: 2 },
              { ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }
            ]
          }]
        }]
      }));

      let lottieAnimation = null;
      if (typeof lottie !== 'undefined') {
        lottieAnimation = lottie.loadAnimation({
          container: document.getElementById('lottie-container'),
          renderer: 'svg',
          loop: false,
          autoplay: false,
          path: sampleLottieJSON
        });
      }

      // ABRIR MODAL
      openBtn.addEventListener('click', () => {
        overlay.classList.add('active');

        if (typeof Motion !== 'undefined') {
          Motion.animate(overlay, { opacity: [0, 1] }, { duration: 0.2 });
          Motion.animate(
            modal,
            { transform: ['translateY(30px) scale(0.9)', 'translateY(0px) scale(1)'] },
            { duration: 0.3, easing: [0.175, 0.885, 0.32, 1.275] }
          );
        }

        if (lottieAnimation) {
          lottieAnimation.goToAndPlay(0, true);
        }
      });

      // FECHAR MODAL
      closeBtn.addEventListener('click', () => {
        if (typeof Motion !== 'undefined') {
          Motion.animate(overlay, { opacity: [1, 0] }, { duration: 0.2 }).finished.then(() => {
            overlay.classList.remove('active');
          });
        } else {
          overlay.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
