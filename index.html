<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Produtividade - PWA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho do Jogador -->
    <header class="app-header">
        <h1>Missões Ativas</h1>
        <span class="xp-badge" id="player-xp">Nível 5 | 1200 XP</span>
    </header>

    <!-- Área do Feed de Missões (Skeletons e Cards Reais) -->
    <main id="quest-board" class="feed">
        <!-- Injetado via JavaScript -->
    </main>

    <!-- REQUISITO 1: ZONA DO POLEGAR (Bottom Nav + FAB) -->
    <nav class="bottom-nav">
        <button class="nav-item active">⚔️ Missões</button>
        <button class="nav-item">💰 Loja</button>
        <button class="nav-item">🛡️ Perfil</button>
        <button class="fab" id="add-btn" aria-label="Nova Missão">+</button>
    </nav>

    <!-- REQUISITO 4 (A4): MODAL DE RECOMPENSA (Lottie + Motion One) -->
    <div id="overlay" class="modal-overlay">
        <div id="modal" class="modal-card">
            <div id="lottie-container"></div>
            <h2>Missão Concluída! 🏆</h2>
            <p id="modal-desc">Você derrotou a tarefa e evoluiu seu herói.</p>
            <div class="xp-gain" id="modal-reward">+100 XP | +50 Moedas</div>
            <button id="close-btn" class="btn btn-collect">Coletar Recompensa</button>
        </div>
    </div>

    <!-- CDNs das Animações -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@motionone/dom/dist/motion.prod.js"></script>
    <script src="script.js"></script>
</body>
</html>
